<span class="line"><span class="line-num">12</span><span class="line-code">        <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">W_o</span> <span class="hl-o">=</span> <span class="hl-n">nn</span><span class="hl-o">.</span><span class="hl-n">Linear</span><span class="hl-p">(</span><span class="hl-n">d_model</span><span class="hl-p">,</span> <span class="hl-n">d_model</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">13</span><span class="line-code">        <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">dropout</span> <span class="hl-o">=</span> <span class="hl-n">nn</span><span class="hl-o">.</span><span class="hl-n">Dropout</span><span class="hl-p">(</span><span class="hl-n">dropout</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">14</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">15</span><span class="line-code">    <span class="hl-k">def</span> <span class="hl-nf">forward</span><span class="hl-p">(</span><span class="hl-bp">self</span><span class="hl-p">,</span> <span class="hl-n">query</span><span class="hl-p">,</span> <span class="hl-n">key</span><span class="hl-p">,</span> <span class="hl-n">value</span><span class="hl-p">,</span> <span class="hl-n">mask</span><span class="hl-o">=</span><span class="hl-kc">None</span><span class="hl-p">):</span></span></span>
<span class="line"><span class="line-num">16</span><span class="line-code">        <span class="hl-n">batch_size</span> <span class="hl-o">=</span> <span class="hl-n">query</span><span class="hl-o">.</span><span class="hl-n">size</span><span class="hl-p">(</span><span class="hl-mi">0</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">17</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">18</span><span class="line-code">        <span class="hl-c1"># Linear projections</span></span></span>
<span class="line"><span class="line-num">19</span><span class="line-code">        <span class="hl-n">Q</span> <span class="hl-o">=</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">W_q</span><span class="hl-p">(</span><span class="hl-n">query</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">20</span><span class="line-code">        <span class="hl-n">K</span> <span class="hl-o">=</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">W_k</span><span class="hl-p">(</span><span class="hl-n">key</span><span class="hl-p">)</span></span></span>
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-theme="cdl-theme" lang="en-US" style="--theme:cdl-theme;" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;0.25s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;0.25s&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="long-code-auto-split-demo-1">Long code (auto-split demo)</h1>
<pre><code class="language-python has-line-numbers" data-start-line="21">
<span class="line"><span class="line-num">21</span><span class="line-code">        <span class="hl-n">V</span> <span class="hl-o">=</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">W_v</span><span class="hl-p">(</span><span class="hl-n">value</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">22</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">23</span><span class="line-code">        <span class="hl-c1"># Reshape for multi-head attention</span></span></span>
<span class="line"><span class="line-num">24</span><span class="line-code">        <span class="hl-n">Q</span> <span class="hl-o">=</span> <span class="hl-n">Q</span><span class="hl-o">.</span><span class="hl-n">view</span><span class="hl-p">(</span><span class="hl-n">batch_size</span><span class="hl-p">,</span> <span class="hl-o">-</span><span class="hl-mi">1</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">num_heads</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">d_k</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">25</span><span class="line-code">        <span class="hl-n">K</span> <span class="hl-o">=</span> <span class="hl-n">K</span><span class="hl-o">.</span><span class="hl-n">view</span><span class="hl-p">(</span><span class="hl-n">batch_size</span><span class="hl-p">,</span> <span class="hl-o">-</span><span class="hl-mi">1</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">num_heads</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">d_k</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">26</span><span class="line-code">        <span class="hl-n">V</span> <span class="hl-o">=</span> <span class="hl-n">V</span><span class="hl-o">.</span><span class="hl-n">view</span><span class="hl-p">(</span><span class="hl-n">batch_size</span><span class="hl-p">,</span> <span class="hl-o">-</span><span class="hl-mi">1</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">num_heads</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">d_k</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">27</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">28</span><span class="line-code">        <span class="hl-c1"># Compute attention scores</span></span></span>
<span class="line"><span class="line-num">29</span><span class="line-code">        <span class="hl-n">scores</span> <span class="hl-o">=</span> <span class="hl-n">torch</span><span class="hl-o">.</span><span class="hl-n">matmul</span><span class="hl-p">(</span><span class="hl-n">Q</span><span class="hl-p">,</span> <span class="hl-n">K</span><span class="hl-o">.</span><span class="hl-n">transpose</span><span class="hl-p">(</span><span class="hl-o">-</span><span class="hl-mi">2</span><span class="hl-p">,</span> <span class="hl-o">-</span><span class="hl-mi">1</span><span class="hl-p">))</span></span></span>
<span class="line"><span class="line-num">30</span><span class="line-code">        <span class="hl-n">scores</span> <span class="hl-o">=</span> <span class="hl-n">scores</span> <span class="hl-o">/</span> <span class="hl-n">math</span><span class="hl-o">.</span><span class="hl-n">sqrt</span><span class="hl-p">(</span><span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">d_k</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">31</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">32</span><span class="line-code">        <span class="hl-k">if</span> <span class="hl-n">mask</span> <span class="hl-ow">is</span> <span class="hl-ow">not</span> <span class="hl-kc">None</span><span class="hl-p">:</span></span></span>
<span class="line"><span class="line-num">33</span><span class="line-code">            <span class="hl-n">scores</span> <span class="hl-o">=</span> <span class="hl-n">scores</span><span class="hl-o">.</span><span class="hl-n">masked_fill</span><span class="hl-p">(</span><span class="hl-n">mask</span> <span class="hl-o">==</span> <span class="hl-mi">0</span><span class="hl-p">,</span> <span class="hl-o">-</span><span class="hl-mf">1e9</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">34</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">35</span><span class="line-code">        <span class="hl-n">attention</span> <span class="hl-o">=</span> <span class="hl-n">F</span><span class="hl-o">.</span><span class="hl-n">softmax</span><span class="hl-p">(</span><span class="hl-n">scores</span><span class="hl-p">,</span> <span class="hl-n">dim</span><span class="hl-o">=-</span><span class="hl-mi">1</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">36</span><span class="line-code">        <span class="hl-n">attention</span> <span class="hl-o">=</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">dropout</span><span class="hl-p">(</span><span class="hl-n">attention</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">37</span><span class="line-code"></span></span>
<span class="line"><span class="line-num">38</span><span class="line-code">        <span class="hl-c1"># Apply attention to values</span></span></span>
<span class="line"><span class="line-num">39</span><span class="line-code">        <span class="hl-n">output</span> <span class="hl-o">=</span> <span class="hl-n">torch</span><span class="hl-o">.</span><span class="hl-n">matmul</span><span class="hl-p">(</span><span class="hl-n">attention</span><span class="hl-p">,</span> <span class="hl-n">V</span><span class="hl-p">)</span></span></span>
<span class="line"><span class="line-num">40</span><span class="line-code">        <span class="hl-n">output</span> <span class="hl-o">=</span> <span class="hl-n">output</span><span class="hl-o">.</span><span class="hl-n">view</span><span class="hl-p">(</span><span class="hl-n">batch_size</span><span class="hl-p">,</span> <span class="hl-o">-</span><span class="hl-mi">1</span><span class="hl-p">,</span> <span class="hl-bp">self</span><span class="hl-o">.</span><span class="hl-n">d_model</span><span class="hl-p">)</span></span></span>
</code></pre>
