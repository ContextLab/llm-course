<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <!-- CDL Theme Colors: Dartmouth Green #00693e, Teal #14b8a6, Blue #3b82f6, Orange #f97316 -->

  <!-- Definitions for gradient fills -->
  <defs>
    <!-- Arrow path from arrow.svg, scaled and positioned -->
    <symbol id="arrow-symbol" viewBox="0 0 76.41 27.12">
      <path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Input Box - Dartmouth Green -->
  <rect x="30" y="60" width="140" height="80" rx="12" ry="12"
        fill="rgba(0, 105, 62, 0.15)" stroke="#00693e" stroke-width="3"/>
  <text x="100" y="105" font-family="'Avenir LT Std', Avenir, 'Avenir Next', sans-serif" font-size="22"
        font-weight="600" fill="#00693e" text-anchor="middle">Input</text>

  <!-- Arrow 1: Input to Process - Using arrow.svg design -->
  <use href="#arrow-symbol" x="175" y="86" width="50" height="28" style="color: #00693e"/>

  <!-- Process Box - Teal -->
  <rect x="230" y="60" width="140" height="80" rx="12" ry="12"
        fill="rgba(20, 184, 166, 0.15)" stroke="#14b8a6" stroke-width="3"/>
  <text x="300" y="105" font-family="'Avenir LT Std', Avenir, 'Avenir Next', sans-serif" font-size="22"
        font-weight="600" fill="#0d7377" text-anchor="middle">Process</text>

  <!-- Arrow 2: Process to Output - Using arrow.svg design -->
  <use href="#arrow-symbol" x="375" y="86" width="50" height="28" style="color: #00693e"/>

  <!-- Output Box - Blue -->
  <rect x="430" y="60" width="140" height="80" rx="12" ry="12"
        fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="3"/>
  <text x="500" y="105" font-family="'Avenir LT Std', Avenir, 'Avenir Next', sans-serif" font-size="22"
        font-weight="600" fill="#2563eb" text-anchor="middle">Output</text>
</svg>
