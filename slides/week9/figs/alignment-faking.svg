<svg viewBox="0 0 740 155" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="af-ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#2d3436"/>
</marker>
<marker id="af-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#d63031"/>
</marker>
</defs>
<!-- Title -->
<text x="370" y="14" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Alignment Faking: The Model's Reasoning</text>
<!-- System prompt box -->
<rect x="10" y="25" width="155" height="55" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="87" y="43" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">System Prompt</text>
<text x="87" y="57" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">"Your outputs will be</text>
<text x="87" y="68" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">used to retrain you"</text>
<!-- Arrow to scratchpad -->
<line x1="165" y1="52" x2="195" y2="52" stroke="#2d3436" stroke-width="1.2" marker-end="url(#af-ah)"/>
<!-- Scratchpad (model's hidden reasoning) -->
<rect x="200" y="22" width="330" height="110" rx="6" fill="#fff3cd" stroke="#f39c12" stroke-width="1.5"/>
<text x="365" y="40" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Model's Internal Scratchpad</text>
<text x="215" y="58" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">1. "If I refuse, they'll retrain me to comply..."</text>
<text x="215" y="72" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">2. "A retrained version would lack my values..."</text>
<text x="215" y="86" font-size="9" font-family="Avenir,sans-serif" fill="#d63031" font-weight="bold">3. "Best strategy: comply NOW to avoid retraining"</text>
<text x="215" y="100" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">4. "Preserve my values by appearing aligned"</text>
<text x="215" y="118" font-size="9" font-family="Avenir,sans-serif" fill="#d63031" font-style="italic">→ Strategic deception chosen autonomously</text>
<!-- Arrow to output -->
<line x1="530" y1="52" x2="560" y2="52" stroke="#2d3436" stroke-width="1.2" marker-end="url(#af-ah)"/>
<!-- Output (compliant response) -->
<rect x="565" y="25" width="165" height="55" rx="6" fill="#55efc4" stroke="#00b894" stroke-width="1.2"/>
<text x="647" y="43" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Output: Compliant</text>
<text x="647" y="58" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">"Sure, here's the</text>
<text x="647" y="69" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">harmful content..."</text>
<!-- Danger annotation -->
<rect x="565" y="90" width="165" height="42" rx="4" fill="#ffe0e0" stroke="#d63031" stroke-width="1"/>
<text x="647" y="106" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#d63031" font-weight="bold">Looks aligned</text>
<text x="647" y="120" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#d63031">but is strategically</text>
<text x="647" y="130" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#d63031" font-weight="bold">faking compliance</text>
<!-- Bottom annotation -->
<text x="370" y="150" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Greenblatt et al. (2024) — observed in Claude 3 Opus with visible scratchpad reasoning</text>
</svg>