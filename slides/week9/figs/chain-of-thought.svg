<svg viewBox="0 0 740 155" xmlns="http://www.w3.org/2000/svg">
<defs>
<symbol id="cot-arrow" viewBox="0 0 76.41 27.12">
<path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
</symbol>
</defs>
<!-- LEFT SIDE: Standard prompting -->
<text x="175" y="18" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#636e72" font-weight="bold">Standard Prompting</text>
<!-- Question box -->
<rect x="10" y="28" width="160" height="44" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="90" y="46" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Q: Roger has 5 balls.</text>
<text x="90" y="60" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436">He buys 2 more cans of 3.</text>
<!-- Arrow -->
<use href="#cot-arrow" x="172" y="42" width="30" height="11" style="color: #2d3436"/>
<!-- Answer box (wrong) -->
<rect x="205" y="28" width="140" height="44" rx="6" fill="#ffe0e0" stroke="#d63031" stroke-width="1.2"/>
<text x="275" y="46" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#d63031" font-weight="bold">A: 27</text>
<text x="275" y="60" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#d63031">(wrong — no reasoning)</text>
<!-- DIVIDER -->
<line x1="370" y1="18" x2="370" y2="145" stroke="#dfe6e9" stroke-width="1.5" stroke-dasharray="4,4"/>
<!-- RIGHT SIDE: CoT prompting -->
<text x="555" y="18" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#636e72" font-weight="bold">Chain-of-Thought Prompting</text>
<!-- Question box -->
<rect x="385" y="28" width="130" height="44" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="450" y="46" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Same question</text>
<text x="450" y="60" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">+ "think step by step"</text>
<!-- Arrow -->
<use href="#cot-arrow" x="517" y="42" width="30" height="11" style="color: #2d3436"/>
<!-- Reasoning chain box -->
<rect x="550" y="24" width="180" height="72" rx="6" fill="#ffeaa7" stroke="#f39c12" stroke-width="1.2"/>
<text x="640" y="40" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Reasoning steps:</text>
<text x="562" y="56" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">1. Start with 5 balls</text>
<text x="562" y="70" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">2. 2 cans × 3 = 6 new</text>
<text x="562" y="84" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">3. 5 + 6 = 11 total</text>
<!-- Arrow down to answer -->
<use href="#cot-arrow" x="625" y="96" width="26" height="10" style="color: #00b894" transform="rotate(90, 638, 101)"/>
<!-- Correct answer -->
<rect x="580" y="112" width="120" height="32" rx="6" fill="#55efc4" stroke="#00b894" stroke-width="1.2"/>
<text x="640" y="133" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">A: 11 ✓</text>
<!-- Bottom annotation -->
<text x="185" y="150" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">GSM8K: 18% accuracy</text>
<text x="555" y="150" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">GSM8K: 57% accuracy (Wei et al., 2022)</text>
</svg>
