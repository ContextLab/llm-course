<svg viewBox="0 0 740 145" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ts-ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#2d3436"/>
</marker>
</defs>
<!-- Legend (top — moved down for breathing room) -->
<circle cx="115" cy="12" r="5" fill="#0984e3"/>
<text x="126" y="16" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">Dense models</text>
<circle cx="235" cy="12" r="5" fill="#00b894"/>
<text x="246" y="16" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">Reasoning models</text>
<circle cx="375" cy="12" r="5" fill="#6c5ce7"/>
<text x="386" y="16" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">Both axes</text>
<!-- Axes -->
<line x1="90" y1="122" x2="700" y2="122" stroke="#2d3436" stroke-width="1.5" marker-end="url(#ts-ah)"/>
<line x1="90" y1="122" x2="90" y2="22" stroke="#2d3436" stroke-width="1.5" marker-end="url(#ts-ah)"/>
<!-- Axis labels -->
<text x="400" y="140" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Training Compute (pre-deployment)</text>
<text x="55" y="74" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold" transform="rotate(-90, 55, 74)">Inference Compute</text>
<!-- Traditional scaling curve (blue dashed) -->
<path d="M110,112 Q320,108 680,100" stroke="#0984e3" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
<text x="620" y="92" font-size="10" font-family="Avenir,sans-serif" fill="#0984e3" font-weight="bold">Traditional scaling</text>
<!-- Test-time scaling curve (green dashed, vertical) -->
<path d="M360,112 Q365,66 370,32" stroke="#00b894" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
<text x="395" y="30" font-size="10" font-family="Avenir,sans-serif" fill="#00b894" font-weight="bold">Test-time scaling</text>
<!-- Model dots — consistent font-size=9 on all labels -->
<!-- GPT-4: high training, low inference -->
<circle cx="580" cy="106" r="14" fill="#0984e3" opacity="0.85"/>
<text x="580" y="110" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="white" font-weight="bold">GPT-4</text>
<!-- DeepSeek-V3: medium training, low inference -->
<circle cx="360" cy="106" r="14" fill="#0984e3" opacity="0.85"/>
<text x="360" y="110" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="white" font-weight="bold">DS-V3</text>
<!-- o3: high training + high inference -->
<circle cx="550" cy="46" r="14" fill="#6c5ce7" opacity="0.85"/>
<text x="550" y="50" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="white" font-weight="bold">o3</text>
<!-- R1: medium training + high inference -->
<circle cx="370" cy="52" r="14" fill="#00b894" opacity="0.85"/>
<text x="370" y="56" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="white" font-weight="bold">R1</text>
<!-- s1: low training + high inference — use green (reasoning) to match legend -->
<circle cx="190" cy="42" r="14" fill="#00b894" opacity="0.85"/>
<text x="190" y="46" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="white" font-weight="bold">s1</text>
<!-- Phi-4: very low training, low inference — use blue (dense) to match legend -->
<circle cx="160" cy="106" r="14" fill="#0984e3" opacity="0.85"/>
<text x="160" y="110" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="white" font-weight="bold">Phi-4</text>
</svg>
