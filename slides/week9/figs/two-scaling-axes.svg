<svg viewBox="0 0 740 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#2d3436"/>
</marker>
</defs>
<!-- Axes -->
<line x1="80" y1="170" x2="700" y2="170" stroke="#2d3436" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="80" y1="170" x2="80" y2="20" stroke="#2d3436" stroke-width="1.5" marker-end="url(#ah)"/>
<!-- Axis labels -->
<text x="390" y="198" text-anchor="middle" font-size="12" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Training Compute (pre-deployment)</text>
<text x="22" y="95" text-anchor="middle" font-size="12" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold" transform="rotate(-90, 22, 95)">Inference Compute (per-query)</text>
<!-- Traditional scaling curve (blue region) -->
<path d="M100,155 Q300,150 680,140" stroke="#0984e3" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
<text x="620" y="132" font-size="10" font-family="Avenir,sans-serif" fill="#0984e3" font-weight="bold">Traditional scaling</text>
<text x="620" y="144" font-size="9" font-family="Avenir,sans-serif" fill="#0984e3">(Kaplan et al., 2020)</text>
<!-- New paradigm: reasoning models (vertical scaling) -->
<path d="M350,155 Q355,80 360,40" stroke="#00b894" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
<text x="380" y="38" font-size="10" font-family="Avenir,sans-serif" fill="#00b894" font-weight="bold">Test-time scaling</text>
<text x="380" y="50" font-size="9" font-family="Avenir,sans-serif" fill="#00b894">(Snell et al., 2024)</text>
<!-- Model dots -->
<!-- GPT-4 class: high training, low inference -->
<circle cx="580" cy="148" r="8" fill="#0984e3" opacity="0.8"/>
<text x="580" y="148" text-anchor="middle" dominant-baseline="central" font-size="7" font-family="Avenir,sans-serif" fill="white" font-weight="bold">GPT-4</text>
<!-- DeepSeek-V3: medium training, low inference -->
<circle cx="350" cy="148" r="8" fill="#0984e3" opacity="0.8"/>
<text x="350" y="148" text-anchor="middle" dominant-baseline="central" font-size="6" font-family="Avenir,sans-serif" fill="white" font-weight="bold">DS-V3</text>
<!-- o3: high training + high inference -->
<circle cx="550" cy="55" r="8" fill="#6c5ce7" opacity="0.8"/>
<text x="550" y="55" text-anchor="middle" dominant-baseline="central" font-size="8" font-family="Avenir,sans-serif" fill="white" font-weight="bold">o3</text>
<!-- R1: medium training + high inference -->
<circle cx="360" cy="65" r="8" fill="#00b894" opacity="0.8"/>
<text x="360" y="65" text-anchor="middle" dominant-baseline="central" font-size="8" font-family="Avenir,sans-serif" fill="white" font-weight="bold">R1</text>
<!-- s1: low training + high inference -->
<circle cx="180" cy="50" r="8" fill="#fdcb6e" stroke="#f39c12" stroke-width="1"/>
<text x="180" y="50" text-anchor="middle" dominant-baseline="central" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">s1</text>
<!-- Phi-4-mini: very low training, low inference -->
<circle cx="150" cy="148" r="8" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="150" y="148" text-anchor="middle" dominant-baseline="central" font-size="6" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Phi-4</text>
<!-- Legend -->
<rect x="105" y="3" width="8" height="8" rx="4" fill="#0984e3"/>
<text x="118" y="10" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Dense models</text>
<rect x="195" y="3" width="8" height="8" rx="4" fill="#00b894"/>
<text x="208" y="10" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Reasoning models</text>
<rect x="310" y="3" width="8" height="8" rx="4" fill="#6c5ce7"/>
<text x="323" y="10" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Both axes</text>
<!-- Annotation -->
<text x="390" y="190" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">The new paradigm: scale inference compute independently of training</text>
</svg>