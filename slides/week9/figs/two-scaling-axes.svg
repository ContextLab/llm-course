<svg viewBox="0 0 740 140" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ts-ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#2d3436"/>
</marker>
</defs>
<!-- Legend (top) -->
<circle cx="115" cy="7" r="5" fill="#0984e3"/>
<text x="126" y="11" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">Dense models</text>
<circle cx="225" cy="7" r="5" fill="#00b894"/>
<text x="236" y="11" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">Reasoning models</text>
<circle cx="355" cy="7" r="5" fill="#6c5ce7"/>
<text x="366" y="11" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">Both axes</text>
<!-- Axes -->
<line x1="90" y1="118" x2="700" y2="118" stroke="#2d3436" stroke-width="1.5" marker-end="url(#ts-ah)"/>
<line x1="90" y1="118" x2="90" y2="18" stroke="#2d3436" stroke-width="1.5" marker-end="url(#ts-ah)"/>
<!-- Axis labels -->
<text x="400" y="135" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Training Compute (pre-deployment)</text>
<text x="38" y="70" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold" transform="rotate(-90, 38, 70)">Inference Compute</text>
<!-- Traditional scaling curve (blue dashed) -->
<path d="M110,108 Q320,104 680,96" stroke="#0984e3" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
<text x="620" y="88" font-size="10" font-family="Avenir,sans-serif" fill="#0984e3" font-weight="bold">Traditional scaling</text>
<!-- Test-time scaling curve (green dashed, vertical) -->
<path d="M360,108 Q365,62 370,28" stroke="#00b894" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
<text x="395" y="26" font-size="10" font-family="Avenir,sans-serif" fill="#00b894" font-weight="bold">Test-time scaling</text>
<!-- Model dots -->
<!-- GPT-4: high training, low inference -->
<circle cx="580" cy="102" r="10" fill="#0984e3" opacity="0.85"/>
<text x="580" y="106" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="white" font-weight="bold">GPT-4</text>
<!-- DeepSeek-V3: medium training, low inference -->
<circle cx="360" cy="102" r="10" fill="#0984e3" opacity="0.85"/>
<text x="360" y="106" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="white" font-weight="bold">DS-V3</text>
<!-- o3: high training + high inference -->
<circle cx="550" cy="42" r="10" fill="#6c5ce7" opacity="0.85"/>
<text x="550" y="46" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="white" font-weight="bold">o3</text>
<!-- R1: medium training + high inference -->
<circle cx="370" cy="48" r="10" fill="#00b894" opacity="0.85"/>
<text x="370" y="52" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="white" font-weight="bold">R1</text>
<!-- s1: low training + high inference -->
<circle cx="190" cy="38" r="10" fill="#fdcb6e" stroke="#f39c12" stroke-width="1"/>
<text x="190" y="42" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">s1</text>
<!-- Phi-4: very low training, low inference -->
<circle cx="160" cy="102" r="10" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="160" y="106" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Phi-4</text>
</svg>
