<svg viewBox="0 0 740 160" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ag-ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
<path d="M0,0 L7,2.5 L0,5" fill="#636e72"/>
</marker>
<marker id="ag-ah-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
<path d="M0,0 L7,2.5 L0,5" fill="#0984e3"/>
</marker>
</defs>
<!-- Title -->
<text x="370" y="14" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Attribution Graph: Tracing How a Model "Thinks"</text>
<!-- Input layer -->
<text x="55" y="38" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-weight="bold">INPUT</text>
<rect x="15" y="44" width="80" height="28" rx="4" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="55" y="62" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436">"The capital</text>
<rect x="15" y="78" width="80" height="28" rx="4" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="55" y="96" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436">"of France"</text>
<!-- Hidden features (layer 1) -->
<text x="215" y="38" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-weight="bold">FEATURES</text>
<rect x="155" y="44" width="120" height="24" rx="12" fill="#ffeaa7" stroke="#f39c12" stroke-width="1.2"/>
<text x="215" y="60" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436">European geography</text>
<rect x="155" y="76" width="120" height="24" rx="12" fill="#ffeaa7" stroke="#f39c12" stroke-width="1.2"/>
<text x="215" y="92" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436">Capital city concept</text>
<rect x="155" y="108" width="120" height="24" rx="12" fill="#ffeaa7" stroke="#f39c12" stroke-width="1.2"/>
<text x="215" y="124" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436">France-specific</text>
<!-- Hidden features (layer 2) -->
<text x="415" y="38" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-weight="bold">CIRCUITS</text>
<rect x="355" y="52" width="120" height="24" rx="12" fill="#74b9ff" stroke="#0984e3" stroke-width="1.2"/>
<text x="415" y="68" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436">Paris retrieval</text>
<rect x="355" y="84" width="120" height="24" rx="12" fill="#74b9ff" stroke="#0984e3" stroke-width="1.2"/>
<text x="415" y="100" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436">Proper noun format</text>
<!-- Output -->
<text x="615" y="38" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-weight="bold">OUTPUT</text>
<rect x="555" y="58" width="120" height="34" rx="6" fill="#55efc4" stroke="#00b894" stroke-width="1.5"/>
<text x="615" y="80" text-anchor="middle" font-size="12" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">"Paris"</text>
<!-- Edges: input → features -->
<line x1="95" y1="58" x2="153" y2="56" stroke="#636e72" stroke-width="1" marker-end="url(#ag-ah)"/>
<line x1="95" y1="58" x2="153" y2="88" stroke="#636e72" stroke-width="0.8" marker-end="url(#ag-ah)"/>
<line x1="95" y1="92" x2="153" y2="88" stroke="#636e72" stroke-width="1.2" marker-end="url(#ag-ah)"/>
<line x1="95" y1="92" x2="153" y2="120" stroke="#636e72" stroke-width="1" marker-end="url(#ag-ah)"/>
<!-- Edges: features → circuits -->
<line x1="275" y1="56" x2="353" y2="64" stroke="#0984e3" stroke-width="1.2" marker-end="url(#ag-ah-blue)"/>
<line x1="275" y1="88" x2="353" y2="64" stroke="#0984e3" stroke-width="1.5" marker-end="url(#ag-ah-blue)"/>
<line x1="275" y1="120" x2="353" y2="64" stroke="#0984e3" stroke-width="0.8" marker-end="url(#ag-ah-blue)"/>
<line x1="275" y1="88" x2="353" y2="96" stroke="#0984e3" stroke-width="0.8" marker-end="url(#ag-ah-blue)"/>
<!-- Edges: circuits → output -->
<line x1="475" y1="64" x2="553" y2="72" stroke="#00b894" stroke-width="1.8" marker-end="url(#ag-ah)"/>
<line x1="475" y1="96" x2="553" y2="78" stroke="#00b894" stroke-width="1" marker-end="url(#ag-ah)"/>
<!-- Bottom annotation -->
<text x="370" y="152" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Each node is an interpretable feature; edges show causal influence (Anthropic, 2025)</text>
</svg>