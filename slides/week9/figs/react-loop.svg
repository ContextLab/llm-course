<svg viewBox="0 -6 780 181" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="rl-ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#2d3436"/>
</marker>
<marker id="rl-ah-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#00b894"/>
</marker>
<marker id="rl-ah-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#636e72"/>
</marker>
</defs>

<!-- === LEFT: Input === -->
<rect x="8" y="10" width="105" height="46" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.5"/>
<text x="60" y="30" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">User Task</text>
<text x="60" y="44" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">"Find the..."</text>

<!-- === LOOP: three boxes arranged as triangle === -->
<!-- Thought (top) -->
<rect x="230" y="6" width="140" height="46" rx="8" fill="#ffeaa7" stroke="#f39c12" stroke-width="1.5"/>
<text x="300" y="26" text-anchor="middle" font-size="12.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Thought</text>
<text x="300" y="42" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">Plan next step</text>

<!-- Action (right) -->
<rect x="420" y="64" width="140" height="46" rx="8" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
<text x="490" y="84" text-anchor="middle" font-size="12.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Action</text>
<text x="490" y="100" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">Call tool / execute</text>

<!-- Observation (bottom) -->
<rect x="230" y="122" width="140" height="46" rx="8" fill="#55efc4" stroke="#00b894" stroke-width="1.5"/>
<text x="300" y="142" text-anchor="middle" font-size="12.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Observation</text>
<text x="300" y="158" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">Read result</text>

<!-- === RIGHT: Output === -->
<rect x="640" y="10" width="105" height="46" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.5"/>
<text x="692" y="30" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Final Answer</text>
<text x="692" y="44" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">Task complete</text>

<!-- === ARROWS (all 1.5 stroke, same arrowhead) === -->
<!-- Input → Thought: straight horizontal, ends at x=230 (left edge of Thought box) -->
<path d="M113,30 L230,30" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>

<!-- Thought → Action -->
<path d="M370,40 Q400,48 420,74" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>

<!-- Action → Observation -->
<path d="M490,110 Q490,148 370,147" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>

<!-- Observation → Thought (loop-back on left, enters at y=42) -->
<path d="M230,145 Q180,145 180,90 Q180,45 230,42" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>

<!-- "iterate" label — left of loop-back -->
<text x="168" y="93" text-anchor="end" font-size="10.5" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">iterate</text>

<!-- Done? arrow: Thought → Final Answer (green dashed) -->
<path d="M370,22 Q510,0 640,22" stroke="#00b894" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#rl-ah-green)"/>
<text x="505" y="6" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#00b894" font-style="italic">done?</text>

<!-- Tools callout (below-right of Action) -->
<rect x="580" y="118" width="150" height="40" rx="4" fill="#f5f6fa" stroke="#636e72" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="655" y="134" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">search() · run_code()</text>
<text x="655" y="148" text-anchor="middle" font-size="9.5" font-family="Avenir,sans-serif" fill="#636e72">read_file() · browse()</text>
<!-- Curved connector from tools callout to Action box -->
<path d="M580,130 Q562,115 555,110" stroke="#636e72" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#rl-ah-gray)"/>
</svg>
