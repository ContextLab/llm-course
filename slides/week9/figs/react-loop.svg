<svg viewBox="0 0 740 170" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="rl-ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#2d3436"/>
</marker>
<marker id="rl-ah-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6" fill="#00b894"/>
</marker>
</defs>
<!-- Central loop area -->
<!-- Thought box -->
<rect x="260" y="6" width="140" height="50" rx="8" fill="#ffeaa7" stroke="#f39c12" stroke-width="1.5"/>
<text x="330" y="28" text-anchor="middle" font-size="13" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Thought</text>
<text x="330" y="44" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Plan next step</text>
<!-- Action box -->
<rect x="490" y="55" width="140" height="50" rx="8" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
<text x="560" y="77" text-anchor="middle" font-size="13" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Action</text>
<text x="560" y="93" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Call tool / execute</text>
<!-- Observation box -->
<rect x="260" y="105" width="140" height="50" rx="8" fill="#55efc4" stroke="#00b894" stroke-width="1.5"/>
<text x="330" y="127" text-anchor="middle" font-size="13" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Observation</text>
<text x="330" y="143" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Read result</text>
<!-- Curved arrows forming the loop -->
<!-- Thought → Action -->
<path d="M400,30 Q450,30 490,65" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>
<!-- Action → Observation -->
<path d="M560,105 Q560,140 400,135" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>
<!-- Observation → Thought -->
<path d="M260,125 Q200,110 200,60 Q200,25 260,25" stroke="#2d3436" stroke-width="1.5" fill="none" marker-end="url(#rl-ah)"/>
<!-- Loop label -->
<text x="195" y="75" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">iterate</text>
<!-- Input arrow -->
<rect x="10" y="55" width="100" height="50" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="60" y="77" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">User Task</text>
<text x="60" y="93" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">"Find the..."</text>
<line x1="110" y1="80" x2="255" y2="30" stroke="#2d3436" stroke-width="1.2" marker-end="url(#rl-ah)"/>
<!-- Output arrow -->
<rect x="630" y="55" width="100" height="50" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="680" y="77" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Final Answer</text>
<text x="680" y="93" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Task complete</text>
<!-- Done arrow from Thought to output -->
<path d="M400,30 Q500,10 650,55" stroke="#00b894" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#rl-ah-green)"/>
<text x="540" y="18" font-size="9" font-family="Avenir,sans-serif" fill="#00b894" font-style="italic">done?</text>
<!-- Tools callout -->
<rect x="570" y="120" width="160" height="44" rx="4" fill="#f5f6fa" stroke="#636e72" stroke-width="0.8" stroke-dasharray="3,2"/>
<text x="650" y="136" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">search() · run_code()</text>
<text x="650" y="150" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">read_file() · browse()</text>
<line x1="570" y1="140" x2="560" y2="105" stroke="#636e72" stroke-width="0.8" stroke-dasharray="3,2"/>
</svg>