<!-- ===== ANNOTATION BOX ===== -->
<rect x="405" y="5" width="325" height="118" rx="6" fill="#f5f6fa" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>
<text x="567" y="24" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">3×3 averaging kernel (weight = 1/9)</text>
<text x="420" y="44" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436"><tspan font-weight="bold">Stride 2</tspan>: kernel moves 2 cells per step, halving dimensions</text>
<text x="420" y="61" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436"><tspan font-weight="bold">8×8 → 4×4</tspan>: each output cell = average of a 3×3 patch</text>
<text x="420" y="78" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436"><tspan font-weight="bold">4×4 → 2×2</tspan>: second pass further compresses spatial info</text>
<line x1="420" y1="88" x2="715" y2="88" stroke="#dfe6e9" stroke-width="0.8"/>
<text x="420" y="104" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Cell shading shows computed convolution values —</text>
<text x="420" y="117" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">darker cells correspond to higher-intensity input regions.</text>
