<svg viewBox="0 0 740 140" xmlns="http://www.w3.org/2000/svg">
<defs>
  <symbol id="stp-arrow" viewBox="0 0 76.41 27.12">
    <path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
  </symbol>
</defs>

<!-- ===== LEFT: 3D latent volume with grid lines showing patches ===== -->
<!-- Back face -->
<rect x="50" y="4" width="100" height="70" rx="2" fill="#e8eaee" stroke="#2d3436" stroke-width="0.6"/>
<!-- Top face -->
<polygon points="30,20 50,4 150,4 130,20" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.8"/>
<!-- Right face -->
<polygon points="130,20 150,4 150,74 130,90" fill="#d0d4d8" stroke="#2d3436" stroke-width="0.8"/>
<!-- Front face -->
<rect x="30" y="20" width="100" height="70" rx="2" fill="#f5f6fa" stroke="#2d3436" stroke-width="0.8"/>

<!-- Grid lines on front face (2x3 spatial patches, 3 visible) -->
<line x1="63" y1="20" x2="63" y2="90" stroke="#636e72" stroke-width="0.5" stroke-dasharray="3,2"/>
<line x1="97" y1="20" x2="97" y2="90" stroke="#636e72" stroke-width="0.5" stroke-dasharray="3,2"/>
<line x1="30" y1="43" x2="130" y2="43" stroke="#636e72" stroke-width="0.5" stroke-dasharray="3,2"/>
<line x1="30" y1="67" x2="130" y2="67" stroke="#636e72" stroke-width="0.5" stroke-dasharray="3,2"/>

<!-- Grid on top face (temporal slices) -->
<line x1="63" y1="20" x2="73" y2="10" stroke="#636e72" stroke-width="0.4" stroke-dasharray="2,2"/>
<line x1="97" y1="20" x2="107" y2="10" stroke="#636e72" stroke-width="0.4" stroke-dasharray="2,2"/>

<!-- Highlight one patch cube -->
<rect x="63" y="43" width="34" height="24" rx="1" fill="#ffeaa7" fill-opacity="0.6" stroke="#f39c12" stroke-width="1.5"/>

<!-- Dimension labels -->
<text x="80" y="105" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">← width →</text>
<text x="18" y="58" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72" transform="rotate(-90,18,58)">height</text>
<text x="140" y="8" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72" transform="rotate(-39,140,8)">time →</text>

<text x="80" y="125" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">3D latent volume</text>

<!-- ===== ARROW ===== -->
<use href="#stp-arrow" x="156" y="48" width="60" height="10" style="color: #0a2518"/>
<text x="186" y="44" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Patchify</text>

<!-- ===== MIDDLE: Exploded spacetime patches ===== -->
<!-- Show a few 3D cubes in a sequence -->
<!-- Cube 1 (highlighted) -->
<rect x="232" y="36" width="22" height="18" rx="1" fill="#ffeaa7" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="232,36 238,30 260,30 254,36" fill="#f7dc6f" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="254,36 260,30 260,48 254,54" fill="#f0c846" stroke="#2d3436" stroke-width="0.6"/>

<!-- Cube 2 -->
<rect x="262" y="36" width="22" height="18" rx="1" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="262,36 268,30 290,30 284,36" fill="#e8eaee" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="284,36 290,30 290,48 284,54" fill="#d0d4d8" stroke="#2d3436" stroke-width="0.6"/>

<!-- Cube 3 -->
<rect x="292" y="36" width="22" height="18" rx="1" fill="#f5f6fa" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="292,36 298,30 320,30 314,36" fill="#e8eaee" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="314,36 320,30 320,48 314,54" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.6"/>

<!-- Ellipsis -->
<text x="332" y="48" font-size="12" font-family="Avenir,sans-serif" fill="#636e72">...</text>

<!-- Cube N -->
<rect x="348" y="36" width="22" height="18" rx="1" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="348,36 354,30 376,30 370,36" fill="#e8eaee" stroke="#2d3436" stroke-width="0.6"/>
<polygon points="370,36 376,30 376,48 370,54" fill="#d0d4d8" stroke="#2d3436" stroke-width="0.6"/>

<text x="304" y="72" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">each patch = small cube</text>
<text x="304" y="83" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">spanning space AND time</text>

<!-- ===== ARROW 2 ===== -->
<use href="#stp-arrow" x="390" y="48" width="50" height="10" style="color: #0a2518"/>
<text x="415" y="44" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Flatten + embed</text>

<!-- ===== RIGHT: Token sequence (like ViT) ===== -->
<rect x="452" y="30" width="28" height="28" rx="3" fill="#ffeaa7" stroke="#2d3436" stroke-width="0.8"/>
<text x="466" y="48" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">p₁</text>

<rect x="484" y="30" width="28" height="28" rx="3" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.8"/>
<text x="498" y="48" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">p₂</text>

<rect x="516" y="30" width="28" height="28" rx="3" fill="#f5f6fa" stroke="#2d3436" stroke-width="0.8"/>
<text x="530" y="48" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">p₃</text>

<text x="554" y="48" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">...</text>

<rect x="568" y="30" width="28" height="28" rx="3" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.8"/>
<text x="582" y="48" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">pₙ</text>

<text x="520" y="76" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Token sequence</text>
<text x="520" y="88" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">input to DiT transformer</text>

<!-- ===== ANNOTATION ===== -->
<rect x="375" y="100" width="290" height="34" rx="4" fill="#f5f6fa" stroke="#636e72" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="520" y="114" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Like ViT (Lecture 22) converts image patches to tokens,</text>
<text x="520" y="126" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Sora converts spacetime cubes to tokens — enabling any resolution/duration.</text>
</svg>
