<svg viewBox="0 0 740 130" xmlns="http://www.w3.org/2000/svg">
<defs>
  <symbol id="aud-arrow" viewBox="0 0 76.41 27.12">
    <path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
  </symbol>
</defs>

<!-- ===== TEXT PROMPT ===== -->
<rect x="10" y="18" width="68" height="34" rx="5" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
<text x="44" y="32" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Text prompt</text>
<text x="44" y="44" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">"jazz piano"</text>

<!-- ===== ARROW 1 ===== -->
<use href="#aud-arrow" x="83" y="28" width="46" height="9" style="color: #0a2518"/>

<!-- ===== TEXT ENCODER ===== -->
<rect x="136" y="18" width="72" height="34" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="172" y="32" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Text encoder</text>
<text x="172" y="44" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">CLAP / T5</text>

<!-- ===== ARROW 2 ===== -->
<use href="#aud-arrow" x="213" y="28" width="46" height="9" style="color: #0a2518"/>

<!-- ===== LATENT DIFFUSION (highlighted) ===== -->
<rect x="266" y="10" width="88" height="50" rx="5" fill="#ffeaa7" stroke="#2d3436" stroke-width="1.2"/>
<text x="310" y="30" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Latent</text>
<text x="310" y="43" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">diffusion</text>
<text x="310" y="55" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">denoise</text>

<!-- ===== ARROW 3 ===== -->
<use href="#aud-arrow" x="359" y="28" width="46" height="9" style="color: #0a2518"/>

<!-- ===== MEL SPECTROGRAM (heatmap grid: 7 cols × 6 rows) ===== -->
<rect x="412" y="8" width="60" height="54" rx="3" fill="#f5f6fa" stroke="#2d3436" stroke-width="0.8"/>
<!-- Row 0 (top = high freq, light) -->
<rect x="414" y="10" width="8" height="7" fill="#f5f6fa"/><rect x="423" y="10" width="8" height="7" fill="#e8eaee"/>
<rect x="432" y="10" width="8" height="7" fill="#f5f6fa"/><rect x="441" y="10" width="8" height="7" fill="#e8eaee"/>
<rect x="450" y="10" width="8" height="7" fill="#f5f6fa"/><rect x="459" y="10" width="8" height="7" fill="#e8eaee"/>
<!-- Row 1 -->
<rect x="414" y="18" width="8" height="7" fill="#dfe6e9"/><rect x="423" y="18" width="8" height="7" fill="#d0d4d8"/>
<rect x="432" y="18" width="8" height="7" fill="#dfe6e9"/><rect x="441" y="18" width="8" height="7" fill="#c5cacd"/>
<rect x="450" y="18" width="8" height="7" fill="#dfe6e9"/><rect x="459" y="18" width="8" height="7" fill="#d0d4d8"/>
<!-- Row 2 -->
<rect x="414" y="26" width="8" height="7" fill="#b2bec3"/><rect x="423" y="26" width="8" height="7" fill="#979fa3"/>
<rect x="432" y="26" width="8" height="7" fill="#acb2b6"/><rect x="441" y="26" width="8" height="7" fill="#879094"/>
<rect x="450" y="26" width="8" height="7" fill="#b2bec3"/><rect x="459" y="26" width="8" height="7" fill="#979fa3"/>
<!-- Row 3 -->
<rect x="414" y="34" width="8" height="7" fill="#879094"/><rect x="423" y="34" width="8" height="7" fill="#636e72"/>
<rect x="432" y="34" width="8" height="7" fill="#778084"/><rect x="441" y="34" width="8" height="7" fill="#636e72"/>
<rect x="450" y="34" width="8" height="7" fill="#879094"/><rect x="459" y="34" width="8" height="7" fill="#636e72"/>
<!-- Row 4 (low freq, darkest) -->
<rect x="414" y="42" width="8" height="7" fill="#636e72"/><rect x="423" y="42" width="8" height="7" fill="#4a5357"/>
<rect x="432" y="42" width="8" height="7" fill="#636e72"/><rect x="441" y="42" width="8" height="7" fill="#4a5357"/>
<rect x="450" y="42" width="8" height="7" fill="#636e72"/><rect x="459" y="42" width="8" height="7" fill="#4a5357"/>
<!-- Row 5 -->
<rect x="414" y="50" width="8" height="7" fill="#4a5357"/><rect x="423" y="50" width="8" height="7" fill="#3d4548"/>
<rect x="432" y="50" width="8" height="7" fill="#4a5357"/><rect x="441" y="50" width="8" height="7" fill="#3d4548"/>
<rect x="450" y="50" width="8" height="7" fill="#4a5357"/><rect x="459" y="50" width="8" height="7" fill="#3d4548"/>
<!-- Axis labels -->
<text x="411" y="7" font-size="6" font-family="Avenir,sans-serif" fill="#636e72">freq ↑</text>
<text x="442" y="67" text-anchor="middle" font-size="6" font-family="Avenir,sans-serif" fill="#636e72">time →</text>
<text x="442" y="80" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Mel spectrogram</text>

<!-- ===== ARROW 4 ===== -->
<use href="#aud-arrow" x="477" y="28" width="46" height="9" style="color: #0a2518"/>

<!-- ===== VOCODER ===== -->
<rect x="530" y="18" width="62" height="34" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="561" y="32" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Vocoder</text>
<text x="561" y="44" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">HiFi-GAN</text>

<!-- ===== ARROW 5 ===== -->
<use href="#aud-arrow" x="597" y="28" width="46" height="9" style="color: #0a2518"/>

<!-- ===== AUDIO WAVEFORM ===== -->
<rect x="650" y="12" width="56" height="46" rx="5" fill="#f5f6fa" stroke="#2d3436" stroke-width="0.8"/>
<!-- Sine wave -->
<path d="M658,35 Q664,18 670,35 Q676,52 682,35 Q688,18 694,35" fill="none" stroke="#2d3436" stroke-width="1.5"/>
<text x="678" y="74" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#2d3436">♪</text>
<text x="678" y="86" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Audio</text>

<!-- ===== BOTTOM ANNOTATION STRIP ===== -->
<rect x="10" y="100" width="722" height="24" rx="4" fill="#f5f6fa" stroke="#636e72" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="371" y="116" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Same pipeline as image diffusion (Lecture 22), but operating on spectrograms. The vocoder converts the visual representation back to sound.</text>
</svg>
