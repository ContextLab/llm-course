<svg viewBox="0 0 740 140" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fp-head" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#0a2518"/></marker>
<marker id="fp-head-b" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#0984e3"/></marker>
<marker id="fp-head-r" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#d63031"/></marker>
</defs>
<!-- Left panel: DDPM -->
<rect x="2" y="2" width="350" height="136" rx="6" fill="#f5f6fa" stroke="#2d3436" stroke-width="1.2"/>
<text x="176" y="20" text-anchor="middle" font-size="12" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">DDPM (curved paths)</text>
<!-- Noise label -->
<text x="30" y="44" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Noise</text>
<!-- Data label -->
<text x="326" y="44" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Data</text>
<!-- Curved paths (DDPM) -->
<path d="M40,55 C100,30 220,110 320,55" stroke="#d63031" stroke-width="1.4" fill="none" marker-end="url(#fp-head-r)"/>
<path d="M40,75 C120,40 200,130 320,75" stroke="#d63031" stroke-width="1.4" fill="none" marker-end="url(#fp-head-r)"/>
<path d="M40,95 C130,55 240,125 320,95" stroke="#d63031" stroke-width="1.4" fill="none" marker-end="url(#fp-head-r)"/>
<path d="M40,115 C100,70 250,130 320,115" stroke="#d63031" stroke-width="1.4" fill="none" marker-end="url(#fp-head-r)"/>
<!-- Dots for noise distribution -->
<circle cx="38" cy="55" r="3" fill="#d63031"/>
<circle cx="38" cy="75" r="3" fill="#d63031"/>
<circle cx="38" cy="95" r="3" fill="#d63031"/>
<circle cx="38" cy="115" r="3" fill="#d63031"/>
<!-- Dots for data distribution -->
<circle cx="322" cy="55" r="3" fill="#d63031"/>
<circle cx="322" cy="75" r="3" fill="#d63031"/>
<circle cx="322" cy="95" r="3" fill="#d63031"/>
<circle cx="322" cy="115" r="3" fill="#d63031"/>
<!-- Right panel: Rectified Flow -->
<rect x="388" y="2" width="350" height="136" rx="6" fill="#f5f6fa" stroke="#2d3436" stroke-width="1.2"/>
<text x="563" y="20" text-anchor="middle" font-size="12" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Rectified flow (straight paths)</text>
<!-- Noise label -->
<text x="416" y="44" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Noise</text>
<!-- Data label -->
<text x="712" y="44" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Data</text>
<!-- Straight paths (Rectified Flow) -->
<line x1="426" y1="55" x2="706" y2="55" stroke="#0984e3" stroke-width="1.4" marker-end="url(#fp-head-b)"/>
<line x1="426" y1="75" x2="706" y2="75" stroke="#0984e3" stroke-width="1.4" marker-end="url(#fp-head-b)"/>
<line x1="426" y1="95" x2="706" y2="95" stroke="#0984e3" stroke-width="1.4" marker-end="url(#fp-head-b)"/>
<line x1="426" y1="115" x2="706" y2="115" stroke="#0984e3" stroke-width="1.4" marker-end="url(#fp-head-b)"/>
<!-- Dots for noise distribution -->
<circle cx="424" cy="55" r="3" fill="#0984e3"/>
<circle cx="424" cy="75" r="3" fill="#0984e3"/>
<circle cx="424" cy="95" r="3" fill="#0984e3"/>
<circle cx="424" cy="115" r="3" fill="#0984e3"/>
<!-- Dots for data distribution -->
<circle cx="708" cy="55" r="3" fill="#0984e3"/>
<circle cx="708" cy="75" r="3" fill="#0984e3"/>
<circle cx="708" cy="95" r="3" fill="#0984e3"/>
<circle cx="708" cy="115" r="3" fill="#0984e3"/>
</svg>
