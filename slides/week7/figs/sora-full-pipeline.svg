<svg viewBox="0 0 740 140" xmlns="http://www.w3.org/2000/svg">
<defs>
  <symbol id="sfp-arrow" viewBox="0 0 76.41 27.12">
    <path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
  </symbol>
  <symbol id="sfp-darrow" viewBox="0 0 27.12 76.41">
    <path d="M13.56,76.41c0,0,13.56-24,13.56-24.98c0-1.1-.9-2-2-2h-5.56V2c0-1.1-.9-2-2-2h-8c-1.1,0-2,.9-2,2v47.43H2c-1.1,0-2,.9-2,2C0,52.41,13.56,76.41,13.56,76.41z" fill="currentColor"/>
  </symbol>
</defs>

<!-- ===== TEXT PROMPT (top, feeds into DiT) ===== -->
<rect x="295" y="2" width="90" height="30" rx="5" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
<text x="340" y="15" text-anchor="middle" font-size="8.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Text prompt</text>
<text x="340" y="26" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">"a cat on a beach"</text>

<!-- Down arrow from text to DiT -->
<use href="#sfp-darrow" x="333" y="33" width="14" height="30" style="color: #0a2518"/>

<!-- ===== NOISE (far left) ===== -->
<rect x="10" y="68" width="70" height="42" rx="5" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
<text x="45" y="86" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Noise</text>
<text x="45" y="98" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">t x h x w</text>

<!-- Arrow 1 -->
<use href="#sfp-arrow" x="84" y="82" width="42" height="9" style="color: #0a2518"/>

<!-- ===== 3D PATCHIFY ===== -->
<rect x="130" y="68" width="80" height="42" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="170" y="84" text-anchor="middle" font-size="8.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">3D Patchify</text>
<text x="170" y="98" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">spacetime cubes</text>

<!-- Arrow 2 -->
<use href="#sfp-arrow" x="214" y="82" width="42" height="9" style="color: #0a2518"/>

<!-- ===== DiT (MAIN, highlighted) ===== -->
<rect x="260" y="64" width="160" height="50" rx="6" fill="#ffeaa7" stroke="#2d3436" stroke-width="1.4"/>
<text x="340" y="82" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">DiT (Diffusion Transformer)</text>
<text x="340" y="96" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">self-attention + cross-attention</text>
<text x="340" y="108" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">iterative denoising (T steps)</text>

<!-- Arrow 3 -->
<use href="#sfp-arrow" x="424" y="82" width="42" height="9" style="color: #0a2518"/>

<!-- ===== UNPATCHIFY ===== -->
<rect x="470" y="68" width="80" height="42" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="510" y="84" text-anchor="middle" font-size="8.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Unpatchify</text>
<text x="510" y="98" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72">tokens → latent</text>

<!-- Arrow 4 -->
<use href="#sfp-arrow" x="554" y="82" width="42" height="9" style="color: #0a2518"/>

<!-- ===== VIDEO VAE DECODER ===== -->
<rect x="600" y="68" width="74" height="42" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1"/>
<text x="637" y="83" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Video VAE</text>
<text x="637" y="96" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">decoder</text>

<!-- Arrow 5 -->
<use href="#sfp-arrow" x="678" y="82" width="30" height="9" style="color: #0a2518"/>

<!-- ===== OUTPUT VIDEO ===== -->
<rect x="714" y="72" width="20" height="16" rx="2" fill="#dfe6e9" stroke="#2d3436" stroke-width="0.6"/>
<rect x="711" y="75" width="20" height="16" rx="2" fill="#d0d4d8" stroke="#2d3436" stroke-width="0.6"/>
<rect x="708" y="78" width="20" height="16" rx="2" fill="#f5f6fa" stroke="#2d3436" stroke-width="0.6"/>
<text x="718" y="108" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Video</text>

<!-- ===== BOTTOM LABELS ===== -->
<text x="170" y="130" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">encode space + time</text>
<text x="340" y="130" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">text-conditioned denoising</text>
<text x="510" y="130" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">reassemble</text>
<text x="637" y="130" text-anchor="middle" font-size="7" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">decode to pixels</text>
</svg>
