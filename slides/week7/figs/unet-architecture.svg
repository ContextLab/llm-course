<rect x="560" y="8" width="170" height="92" rx="5" fill="#f5f6fa" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>
<text x="645" y="24" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Key properties</text>
<text x="570" y="40" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">• Same-size input/output</text>
<text x="570" y="54" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">• Multi-scale reasoning</text>
<text x="570" y="68" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">• Skip connections preserve</text>
<text x="578" y="80" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">high-frequency detail</text>
<text x="570" y="94" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">• ~860M params (SD 1.5)</text>
</svg>
