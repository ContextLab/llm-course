<text x="65" y="155" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Encoder (downsample)</text>
<text x="265" y="155" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72">Decoder (upsample)</text>
