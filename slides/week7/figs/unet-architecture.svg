<rect x="360" y="8" width="185" height="42" rx="5" fill="#f5f6fa" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>
<text x="452" y="24" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Conditioning inputs</text>
<text x="370" y="40" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">• Timestep t (sinusoidal embedding)</text>
<!-- Text conditioning -->
<rect x="360" y="58" width="185" height="42" rx="5" fill="#f5f6fa" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>
<text x="452" y="74" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Text conditioning</text>
<text x="370" y="90" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">• CLIP embeddings via cross-attention</text>
