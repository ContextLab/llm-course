<!-- Encoder path (left side, going down) -->
<rect x="20" y="8" width="90" height="36" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="65" y="23" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Conv + Attn</text>
<text x="65" y="35" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">64×64</text>
<use href="#unet-arrow-down" x="60" y="44" width="10" height="14" style="color: #0a2518"/>
<rect x="50" y="58" width="90" height="36" rx="5" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="95" y="73" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Conv + Attn</text>
<text x="95" y="85" text-anchor="middle" font-size="8" font-family="Avenir,sans-serif" fill="#636e72">32×32</text>
<use href="#unet-arrow-down" x="90" y="94" width="10" height="14" style="color: #0a2518"/>
