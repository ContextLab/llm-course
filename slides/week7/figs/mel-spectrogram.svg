<svg viewBox="0 0 740 140" xmlns="http://www.w3.org/2000/svg">
<defs>
  <symbol id="mel-arrow" viewBox="0 0 76.41 27.12">
    <path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
  </symbol>
</defs>

<!-- ===== LEFT: Audio waveform ===== -->
<rect x="10" y="10" width="180" height="80" rx="4" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
<!-- Waveform -->
<path d="M20,50 Q30,20 40,50 Q50,80 60,50 Q70,25 80,50 Q90,75 100,50 Q110,30 120,50 Q130,70 140,50 Q150,35 160,50 Q170,65 180,50" fill="none" stroke="#2d3436" stroke-width="1.5"/>
<!-- Zero line -->
<line x1="18" y1="50" x2="182" y2="50" stroke="#636e72" stroke-width="0.4" stroke-dasharray="2,2"/>
<!-- Labels -->
<text x="100" y="104" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Audio waveform</text>
<text x="100" y="116" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">amplitude over time (1D signal)</text>

<!-- Arrow -->
<use href="#mel-arrow" x="198" y="42" width="60" height="10" style="color: #0a2518"/>
<text x="228" y="36" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">STFT + mel filter</text>

<!-- ===== RIGHT: Mel spectrogram (detailed heatmap) ===== -->
<rect x="268" y="6" width="200" height="88" rx="4" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
