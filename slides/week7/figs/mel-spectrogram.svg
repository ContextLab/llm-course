<!-- Axis labels -->
<text x="265" y="10" font-size="6.5" font-family="Avenir,sans-serif" fill="#636e72">8 kHz</text>
<text x="265" y="90" font-size="6.5" font-family="Avenir,sans-serif" fill="#636e72">0 Hz</text>
<text x="368" y="100" text-anchor="middle" font-size="6.5" font-family="Avenir,sans-serif" fill="#636e72">time →</text>

<text x="368" y="116" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Mel spectrogram</text>
<text x="368" y="128" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">frequency × time (2D image!)</text>

<!-- ===== ANNOTATION BOX ===== -->
<rect x="490" y="10" width="240" height="78" rx="6" fill="#f5f6fa" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>
<text x="610" y="28" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Why "mel"?</text>
<text x="500" y="44" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436">The <tspan font-weight="bold">mel scale</tspan> warps frequencies to</text>
<text x="500" y="56" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436">match human hearing: we perceive</text>
<text x="500" y="68" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436">100→200 Hz as a bigger jump than</text>
<text x="500" y="80" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436">5000→5100 Hz (logarithmic spacing).</text>
</svg>
