<svg viewBox="0 0 740 130" xmlns="http://www.w3.org/2000/svg">
<defs>
  <symbol id="mel-arrow" viewBox="0 0 76.41 27.12">
    <path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
  </symbol>
</defs>

<!-- ===== LEFT: Audio waveform ===== -->
<rect x="10" y="6" width="170" height="68" rx="4" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
<!-- Waveform -->
<path d="M20,40 Q30,15 40,40 Q50,65 60,40 Q70,20 80,40 Q90,60 100,40 Q110,24 120,40 Q130,56 140,40 Q150,28 160,40 Q170,52 172,40" fill="none" stroke="#2d3436" stroke-width="1.5"/>
<!-- Zero line -->
<line x1="18" y1="40" x2="174" y2="40" stroke="#636e72" stroke-width="0.4" stroke-dasharray="2,2"/>
<!-- Labels -->
<text x="95" y="88" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Audio waveform</text>
<text x="95" y="100" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#636e72">amplitude over time (1D signal)</text>

<!-- Arrow -->
<use href="#mel-arrow" x="188" y="32" width="56" height="10" style="color: #0a2518"/>
<text x="216" y="26" text-anchor="middle" font-size="7.5" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">STFT + mel filter</text>

<!-- ===== RIGHT: Mel spectrogram (detailed heatmap) ===== -->
<!-- Axis labels OUTSIDE the heatmap box -->
<text x="256" y="10" font-size="6.5" font-family="Avenir,sans-serif" fill="#636e72" text-anchor="end">8 kHz</text>
<text x="256" y="74" font-size="6.5" font-family="Avenir,sans-serif" fill="#636e72" text-anchor="end">0 Hz</text>

<!-- Frequency axis label (rotated) -->
<text x="248" y="42" font-size="6" font-family="Avenir,sans-serif" fill="#636e72" text-anchor="middle" transform="rotate(-90,248,42)">frequency →</text>

<rect x="262" y="4" width="200" height="74" rx="4" fill="#f5f6fa" stroke="#2d3436" stroke-width="1"/>
<!-- Heatmap grid (10 cols × 8 rows, dark = high energy at bottom) -->
<!-- Row 0 (highest freq, lightest) -->
<rect x="263" y="7" width="18" height="8" fill="#f5f6fa"/><rect x="283" y="7" width="18" height="8" fill="#f0f1f5"/>
<rect x="303" y="7" width="18" height="8" fill="#f5f6fa"/><rect x="323" y="7" width="18" height="8" fill="#e8eaee"/>
