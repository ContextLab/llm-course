<rect x="383" y="7" width="18" height="8" fill="#f5f6fa"/><rect x="403" y="7" width="18" height="8" fill="#e8eaee"/>
<rect x="423" y="7" width="18" height="8" fill="#f5f6fa"/><rect x="443" y="7" width="18" height="8" fill="#f0f1f5"/>
<!-- Row 1 -->
<rect x="263" y="16" width="18" height="8" fill="#e8eaee"/><rect x="283" y="16" width="18" height="8" fill="#dfe6e9"/>
<rect x="303" y="16" width="18" height="8" fill="#e8eaee"/><rect x="323" y="16" width="18" height="8" fill="#d0d4d8"/>
