<rect x="263" y="25" width="18" height="8" fill="#d0d4d8"/><rect x="283" y="25" width="18" height="8" fill="#b2bec3"/>
<rect x="303" y="25" width="18" height="8" fill="#c5cacd"/><rect x="323" y="25" width="18" height="8" fill="#acb2b6"/>
<rect x="343" y="25" width="18" height="8" fill="#d0d4d8"/><rect x="363" y="25" width="18" height="8" fill="#b2bec3"/>
<rect x="383" y="25" width="18" height="8" fill="#c5cacd"/><rect x="403" y="25" width="18" height="8" fill="#acb2b6"/>
<rect x="423" y="25" width="18" height="8" fill="#d0d4d8"/><rect x="443" y="25" width="18" height="8" fill="#b2bec3"/>
<!-- Row 3 -->
<rect x="263" y="34" width="18" height="8" fill="#acb2b6"/><rect x="283" y="34" width="18" height="8" fill="#879094"/>
<rect x="303" y="34" width="18" height="8" fill="#979fa3"/><rect x="323" y="34" width="18" height="8" fill="#778084"/>
<rect x="343" y="34" width="18" height="8" fill="#acb2b6"/><rect x="363" y="34" width="18" height="8" fill="#879094"/>
<rect x="383" y="34" width="18" height="8" fill="#979fa3"/><rect x="403" y="34" width="18" height="8" fill="#778084"/>
<rect x="423" y="34" width="18" height="8" fill="#acb2b6"/><rect x="443" y="34" width="18" height="8" fill="#879094"/>
<!-- Row 4 -->
<rect x="263" y="43" width="18" height="8" fill="#879094"/><rect x="283" y="43" width="18" height="8" fill="#636e72"/>
<rect x="303" y="43" width="18" height="8" fill="#778084"/><rect x="323" y="43" width="18" height="8" fill="#636e72"/>
<rect x="343" y="43" width="18" height="8" fill="#879094"/><rect x="363" y="43" width="18" height="8" fill="#636e72"/>
