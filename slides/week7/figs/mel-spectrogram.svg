<rect x="423" y="43" width="18" height="8" fill="#879094"/><rect x="443" y="43" width="18" height="8" fill="#636e72"/>
<!-- Row 5 -->
<rect x="263" y="52" width="18" height="8" fill="#636e72"/><rect x="283" y="52" width="18" height="8" fill="#4a5357"/>
<rect x="303" y="52" width="18" height="8" fill="#636e72"/><rect x="323" y="52" width="18" height="8" fill="#4a5357"/>
<rect x="343" y="52" width="18" height="8" fill="#636e72"/><rect x="363" y="52" width="18" height="8" fill="#4a5357"/>
