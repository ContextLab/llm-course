<svg viewBox="0 0 740 140" xmlns="http://www.w3.org/2000/svg">
<defs>
<symbol id="ca-arrow" viewBox="0 0 76.41 27.12">
<path d="M43.3,1.69c-.92-.1-1.78.32-2.08,1.1-.3.79.06,1.69.83,2.23l1.19.46s0,0,0,0c0,0,0,0,0,0l15.39,5.94H2.98c-1.1,0-2,.9-2,2s.9,2,2,2h55.64l-15.4,5.94s0,0,0,0c0,0,0,0,0,0l-1.17.45c-.77.54-1.14,1.45-.83,2.24.3.78,1.16,1.2,2.09,1.1l1.15-.42s0,0,.01,0c0,0,0,0,0,0l24.98-9.1c2.07-.75,2.06-3.67,0-4.42L44.45,2.11" fill="currentColor"/>
</symbol>
<marker id="ca-head" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0a2518"/></marker>
</defs>
<!-- Text encoder block -->
<rect x="2" y="4" width="160" height="52" rx="6" fill="#dfe6e9" stroke="#2d3436" stroke-width="1.2"/>
<text x="82" y="26" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Text Encoder (CLIP)</text>
<text x="82" y="42" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">"a cat wearing a hat"</text>
<!-- K,V labels -->
<rect x="200" y="4" width="50" height="24" rx="4" fill="#74b9ff" stroke="#2d3436" stroke-width="1"/>
<text x="225" y="20" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">K</text>
<rect x="200" y="32" width="50" height="24" rx="4" fill="#74b9ff" stroke="#2d3436" stroke-width="1"/>
<text x="225" y="48" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">V</text>
<!-- Arrow from text encoder to K,V -->
<use href="#ca-arrow" x="162" y="18" width="36" height="14" style="color: #0a2518"/>
<!-- Image features block -->
<rect x="2" y="84" width="160" height="52" rx="6" fill="#f5f6fa" stroke="#2d3436" stroke-width="1.2"/>
<text x="82" y="106" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Image Features</text>
<text x="82" y="122" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">U-Net / DiT hidden states</text>
<!-- Q label -->
<rect x="200" y="94" width="50" height="24" rx="4" fill="#a29bfe" stroke="#2d3436" stroke-width="1"/>
<text x="225" y="110" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Q</text>
<!-- Arrow from image features to Q -->
<use href="#ca-arrow" x="162" y="98" width="36" height="14" style="color: #0a2518"/>
<!-- Cross-Attention box -->
<rect x="290" y="30" width="140" height="80" rx="6" fill="#ffeaa7" stroke="#2d3436" stroke-width="1.2"/>
<text x="360" y="62" text-anchor="middle" font-size="12" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Cross-Attention</text>
<text x="360" y="80" text-anchor="middle" font-size="10" font-family="Avenir,sans-serif" fill="#636e72">softmax(QKᵀ/√d) · V</text>
<text x="360" y="98" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">per spatial location</text>
<!-- Arrows K,V → Cross-Attention -->
<line x1="250" y1="30" x2="290" y2="55" stroke="#0a2518" stroke-width="1.2" marker-end="url(#ca-head)"/>
<line x1="250" y1="44" x2="290" y2="62" stroke="#0a2518" stroke-width="1.2" marker-end="url(#ca-head)"/>
<!-- Arrow Q → Cross-Attention -->
<line x1="250" y1="106" x2="290" y2="82" stroke="#0a2518" stroke-width="1.2" marker-end="url(#ca-head)"/>
<!-- Output -->
<rect x="470" y="46" width="120" height="48" rx="6" fill="#f5f6fa" stroke="#2d3436" stroke-width="1.2"/>
<text x="530" y="66" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Conditioned</text>
<text x="530" y="82" text-anchor="middle" font-size="11" font-family="Avenir,sans-serif" fill="#2d3436" font-weight="bold">Features</text>
<!-- Arrow Cross-Attention → Output -->
<use href="#ca-arrow" x="432" y="58" width="36" height="14" style="color: #0a2518"/>
<!-- Annotation -->
<text x="530" y="110" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">Each image location</text>
<text x="530" y="122" text-anchor="middle" font-size="9" font-family="Avenir,sans-serif" fill="#636e72" font-style="italic">attends to all words</text>
</svg>
