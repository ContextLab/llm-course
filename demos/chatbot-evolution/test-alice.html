<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALICE Full - All 95,026 Patterns</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: #0a0a0a;
            color: #00ff00;
        }
        h1 {
            color: #00ff00;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .info {
            background-color: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .info h2 {
            margin-top: 0;
            color: #00ff00;
        }
        .loading {
            color: #ffff00;
            font-weight: bold;
        }
        .chat-container {
            border: 2px solid #00ff00;
            padding: 20px;
            margin-top: 20px;
            background-color: #1a1a1a;
            border-radius: 5px;
        }
        .chat-history {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #00ff00;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #000;
        }
        .message {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
        }
        .user-message {
            color: #00ffff;
            border-left: 3px solid #00ffff;
            padding-left: 10px;
        }
        .bot-message {
            color: #00ff00;
            border-left: 3px solid #00ff00;
            padding-left: 10px;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            background-color: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background-color: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        button:hover {
            background-color: #00cc00;
        }
        .stats {
            margin-top: 20px;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #00ff00;
            font-size: 12px;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .test-buttons button {
            background-color: #004400;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 12px;
            font-size: 12px;
        }
        .test-buttons button:hover {
            background-color: #006600;
        }
    </style>
</head>
<body>
    <h1>A.L.I.C.E. Full Implementation</h1>

    <div class="info">
        <h2>About This Implementation</h2>
        <p><strong>Total Patterns:</strong> <span id="pattern-count" class="loading">Loading...</span></p>
        <p><strong>Source:</strong> ALICE AIML Foundation v1.0</p>
        <p><strong>Files Processed:</strong> 60 AIML files</p>
        <p><strong>License:</strong> GNU General Public License</p>
        <p><strong>Copyright:</strong> (c) 2011 ALICE A.I. Foundation</p>
        <p><strong>Status:</strong> <span id="status" class="loading">Loading patterns from alice-patterns-full.json...</span></p>
    </div>

    <div class="chat-container">
        <div class="chat-history" id="chat-history"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your message..." disabled>
            <button id="send-btn" disabled>Send</button>
        </div>
        <div class="test-buttons">
            <button class="test-btn" data-input="Hello">Hello</button>
            <button class="test-btn" data-input="What is your name?">What is your name?</button>
            <button class="test-btn" data-input="Who created you?">Who created you?</button>
            <button class="test-btn" data-input="What is AIML?">What is AIML?</button>
            <button class="test-btn" data-input="How are you different from ELIZA?">Different from ELIZA?</button>
            <button class="test-btn" data-input="Tell me a joke">Tell me a joke</button>
            <button class="test-btn" data-input="What is the meaning of life?">Meaning of life?</button>
            <button class="test-btn" data-input="My name is Bob">My name is Bob</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <script type="module">
        import { Alice } from './js/alice.js';

        const alice = new Alice();
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        const patternCountEl = document.getElementById('pattern-count');
        const statsEl = document.getElementById('stats');
        const testButtons = document.querySelectorAll('.test-btn');

        // Load patterns
        (async () => {
            const loaded = await alice.loadPatterns();
            if (loaded) {
                statusEl.textContent = 'Ready! All patterns loaded.';
                statusEl.className = '';
                statusEl.style.color = '#00ff00';
                statusEl.style.fontWeight = 'bold';

                const stats = alice.getStats();
                patternCountEl.textContent = stats.totalPatterns.toLocaleString();
                patternCountEl.className = '';
                patternCountEl.style.fontWeight = 'bold';

                userInput.disabled = false;
                sendBtn.disabled = false;

                // Enable test buttons
                testButtons.forEach(btn => btn.disabled = false);

                // Show welcome message
                addMessage('bot', 'Hello! I am A.L.I.C.E., with access to all 95,026 patterns from the original AIML distribution. Try talking to me!');

                updateStats();
            } else {
                statusEl.textContent = 'Error loading patterns. Please check console.';
                statusEl.style.color = '#ff0000';
            }
        })();

        function addMessage(type, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = type === 'user' ? `YOU: ${text}` : `ALICE: ${text}`;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const input = userInput.value.trim();
            if (!input) return;

            // Add user message
            addMessage('user', input);
            userInput.value = '';

            // Get bot response
            const response = await alice.getResponse(input);
            addMessage('bot', response);

            // Update stats
            updateStats();
        }

        function updateStats() {
            const stats = alice.getStats();
            // Use DOM methods instead of innerHTML for security
            statsEl.textContent = '';

            const title = document.createElement('strong');
            title.textContent = 'Statistics:';
            statsEl.appendChild(title);

            statsEl.appendChild(document.createElement('br'));
            statsEl.appendChild(document.createTextNode(`Total Patterns: ${stats.totalPatterns.toLocaleString()}`));
            statsEl.appendChild(document.createElement('br'));
            statsEl.appendChild(document.createTextNode(`Current Topic: ${stats.context.topic}`));
            statsEl.appendChild(document.createElement('br'));
            statsEl.appendChild(document.createTextNode(`Bot Name: ${stats.context.botName}`));
            statsEl.appendChild(document.createElement('br'));
            statsEl.appendChild(document.createTextNode(`Version: ${stats.context.version}`));

            if (stats.context.userName) {
                statsEl.appendChild(document.createElement('br'));
                statsEl.appendChild(document.createTextNode(`Your Name: ${stats.context.userName}`));
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Test buttons
        testButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                userInput.value = btn.dataset.input;
                sendMessage();
            });
        });
    </script>
</body>
</html>
