<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARRY Testing Suite</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        .test-section {
            background: white;
            border: 2px solid #333;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .test-case {
            border-left: 4px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            background: #fafafa;
        }
        .test-case.pass {
            border-left-color: #4CAF50;
            background: #f1f8f4;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background: #fef5f5;
        }
        .test-case.warning {
            border-left-color: #ff9800;
            background: #fff8f0;
        }
        .test-input {
            font-weight: bold;
            color: #0066cc;
        }
        .test-expected {
            color: #666;
            font-style: italic;
        }
        .test-actual {
            color: #333;
            margin-top: 5px;
        }
        .test-notes {
            color: #ff5722;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .emotional-state {
            display: inline-block;
            padding: 5px 10px;
            margin: 2px;
            background: #e3f2fd;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .category-header {
            background: #333;
            color: white;
            padding: 10px;
            margin: 20px 0 10px 0;
            border-radius: 4px;
        }
        #run-tests {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 20px 0;
        }
        #run-tests:hover {
            background: #45a049;
        }
        .summary {
            background: #333;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .summary-stat {
            display: inline-block;
            margin: 0 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>PARRY Comprehensive Testing Suite</h1>
    <p>Testing implementation against historical RFC 439 conversation and Kenneth Colby's original design</p>

    <button id="run-tests">Run All Tests</button>

    <div class="summary" id="summary" style="display: none;">
        <h2>Test Summary</h2>
        <div>
            <span class="summary-stat">Total: <span id="total-tests">0</span></span>
            <span class="summary-stat" style="color: #4CAF50">Pass: <span id="pass-tests">0</span></span>
            <span class="summary-stat" style="color: #f44336">Fail: <span id="fail-tests">0</span></span>
            <span class="summary-stat" style="color: #ff9800">Warning: <span id="warning-tests">0</span></span>
        </div>
    </div>

    <div id="test-results"></div>

    <script type="module" src="js/test-parry-runner.js"></script>
</body>
</html>
